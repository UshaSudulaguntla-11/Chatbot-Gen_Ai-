<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - Scientific Oracle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-midnight: #020617;
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --glass: rgba(15, 23, 42, 0.75);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-midnight);
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            color: #f1f5f9;
        }

        /* --- STARRY BACKGROUND --- */
        #celestial-bg {
            position: absolute;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.5); }
        }

        /* --- CYBERNETIC ENTITY AVATAR --- */
        .avatar-viewport {
            width: 180px;
            height: 180px;
            position: relative;
            margin: 0 auto 30px auto;
        }

        .oracle-head {
            width: 130px;
            height: 160px;
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.15) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 2px solid rgba(56, 189, 248, 0.4);
            border-radius: 65px 65px 55px 55px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            overflow: hidden;
        }

        .eye-row { display: flex; gap: 25px; margin-top: 10px; }
        .eye {
            width: 22px; height: 10px; background: var(--accent-primary);
            border-radius: 20px; box-shadow: 0 0 15px var(--accent-primary);
            animation: blink 4s infinite;
        }

        @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }

        .digital-mouth { display: flex; align-items: center; gap: 3px; height: 30px; width: 60px; justify-content: center; }
        .mouth-segment { width: 4px; height: 4px; background: var(--accent-primary); border-radius: 2px; transition: height 0.1s ease; }

        /* --- CHAT FORMATTING --- */
        .chat-msg h3 { font-weight: 800; color: #38bdf8; margin-top: 1rem; margin-bottom: 0.5rem; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 0.05em; }
        .chat-msg h4 { font-weight: 700; color: #818cf8; margin-top: 0.75rem; margin-bottom: 0.25rem; font-size: 0.85rem; }
        .chat-msg p { margin-bottom: 0.75rem; }
        .chat-msg strong { color: #f1f5f9; border-bottom: 1px solid rgba(56, 189, 248, 0.3); }

        .glass-sidebar { background: var(--glass); backdrop-filter: blur(25px); border-right: 1px solid rgba(255, 255, 255, 0.05); }
        .bot-bubble { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(56, 189, 248, 0.2); }
        .user-bubble { background: linear-gradient(135deg, #312e81 0%, #1e1b4b 100%); border: 1px solid rgba(129, 140, 248, 0.3); }

        #chat-flow::-webkit-scrollbar { width: 4px; }
        #chat-flow::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.2); border-radius: 10px; }
        
        .toggle-checkbox:checked + .toggle-label { background-color: #38bdf8; }
        .toggle-checkbox:checked + .toggle-label .toggle-dot { transform: translateX(100%); }
    </style>
</head>
<body>
    <div id="celestial-bg"></div>

    <aside class="w-80 hidden md:flex flex-col glass-sidebar h-screen z-10">
        <div class="p-8 flex-1">
            <div class="avatar-viewport">
                <div class="oracle-head">
                    <div class="eye-row"><div class="eye"></div><div class="eye"></div></div>
                    <div class="digital-mouth" id="mouth">
                        <div class="mouth-segment"></div><div class="mouth-segment"></div>
                        <div class="mouth-segment"></div><div class="mouth-segment"></div>
                        <div class="mouth-segment"></div><div class="mouth-segment"></div>
                    </div>
                </div>
            </div>

            <div class="text-center mb-10">
                <h1 class="text-2xl font-black text-white tracking-tighter uppercase">Nexus <span class="text-blue-400">Oracle</span></h1>
                <p class="text-[9px] uppercase tracking-[0.4em] text-blue-500/60 font-black mt-1">Physics & Chemistry Matrix</p>
            </div>

            <div class="space-y-6">
                <div class="p-4 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-between">
                    <div>
                        <p class="text-[10px] font-black text-white uppercase tracking-widest">Audio Core</p>
                        <p id="audio-status-text" class="text-[9px] text-blue-400/70 uppercase">Active</p>
                    </div>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" id="audio-toggle" checked class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 border-transparent appearance-none cursor-pointer z-10"/>
                        <label for="audio-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-700 cursor-pointer">
                            <span class="toggle-dot block w-5 h-5 rounded-full bg-white shadow transform transition-transform duration-200 ease-in"></span>
                        </label>
                    </div>
                </div>

                <div class="space-y-2">
                    <p class="text-[10px] uppercase font-bold text-slate-500 tracking-widest px-2">Core Access</p>
                    <button onclick="handleSend('Explain Quantum Mechanics.')" class="w-full text-left p-4 rounded-2xl bg-white/5 border border-white/5 hover:border-blue-500/40 transition-all text-xs font-semibold text-slate-300">Physics Core</button>
                    <button onclick="handleSend('Atomic Theory overview.')" class="w-full text-left p-4 rounded-2xl bg-white/5 border border-white/5 hover:border-blue-500/40 transition-all text-xs font-semibold text-slate-300">Chemistry Core</button>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen relative z-10">
        <header class="h-20 px-10 border-b border-white/5 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-emerald-500 rounded-full shadow-[0_0_10px_#10b981]"></div>
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Neural Link: Science Exclusive</span>
            </div>
            <button onclick="stopAllAudio()" class="text-[9px] font-black text-rose-500 uppercase tracking-widest border border-rose-500/20 px-3 py-1 rounded-full hover:bg-rose-500/10">Silence</button>
        </header>

        <div id="chat-flow" class="flex-1 overflow-y-auto p-10 space-y-8">
            <div id="welcome" class="max-w-3xl mx-auto py-20 text-center">
                <h2 class="text-6xl font-black text-white tracking-tighter mb-6">Scientific <span class="text-blue-400">Oracle.</span></h2>
                <p class="text-slate-500 text-lg max-w-lg mx-auto italic leading-relaxed">Initialized. I respond exclusively to Physics and Chemistry. Non-scientific inquiries and financial discussion will be rejected.</p>
            </div>
        </div>

        <div class="p-10">
            <div class="max-w-4xl mx-auto">
                <div class="input-pill p-2 rounded-[2.5rem] flex items-center gap-3">
                    <textarea id="user-input" rows="1" placeholder="Consult the scientific matrix..." class="flex-1 bg-transparent border-none focus:ring-0 text-white py-4 px-6 text-base placeholder-slate-700 resize-none font-medium"></textarea>
                    <button id="send-btn" class="w-14 h-14 bg-blue-600 hover:bg-blue-500 text-white rounded-full flex items-center justify-center transition-all active:scale-90">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const chatFlow = document.getElementById('chat-flow');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const mouthSegments = document.querySelectorAll('.mouth-segment');
        const audioToggle = document.getElementById('audio-toggle');

        let isSpeaking = false;
        let audioEnabled = true;

        audioToggle.addEventListener('change', e => {
            audioEnabled = e.target.checked;
            if (!audioEnabled) stopAllAudio();
        });

        function stopAllAudio() {
            window.speechSynthesis.cancel();
            isSpeaking = false;
            resetMouth();
        }

        // Simple Markdown-to-HTML formatter for headings
        function formatMarkdown(text) {
            return text
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^#### (.*$)/gim, '<h4>$1</h4>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function speakLocally(text) {
            if (!audioEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/[#*]/g, ''); // Clean markdown for speech
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.onstart = () => { isSpeaking = true; animateMouth(); };
            utterance.onend = () => { isSpeaking = false; resetMouth(); };
            window.speechSynthesis.speak(utterance);
        }

        function animateMouth() {
            if (!isSpeaking) return;
            mouthSegments.forEach(s => s.style.height = `${4 + Math.random() * 24}px`);
            setTimeout(animateMouth, 80);
        }

        function resetMouth() { mouthSegments.forEach(s => s.style.height = '4px'); }

        async function handleSend(customText = null) {
            const text = (customText || userInput.value).trim();
            if (!text) return;

            document.getElementById('welcome')?.remove();
            addMessage(text, 'user');
            userInput.value = '';

            const loadingId = addMessage("Analyzing Matrix...", 'bot');

            const systemPrompt = `You are the Nexus Scientific Oracle. 
            CORE RESTRICTIONS:
            1. ONLY answer questions about Physics and Chemistry.
            2. If the user says 'Hi', 'Hello', or 'Greetings', respond warmly but remind them you only handle Physics and Chemistry.
            3. For any other non-science subject (Math, History, Fees, etc.), respond ONLY with: 'Inquiry rejected. My neural matrix is restricted to the laws of Physics and Chemistry.'
            4. FORMATTING: Use '### Heading Name' for main sections and '#### Subheading Name' for secondary points. Use **bold** for key terms.
            5. TONE: Professional, robotic, and highly structured.`;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `[SYSTEM_GUIDE: ${systemPrompt}] User: ${text}` })
                });

                const data = await response.json();
                const aiResponse = data.reply;

                updateBotMessage(loadingId, aiResponse);
                speakLocally(aiResponse);

            } catch (err) {
                updateBotMessage(loadingId, "Nexus Protocol Error: Connection Severed.");
            }
        }

        function addMessage(text, role) {
            const id = Date.now();
            const isUser = role === 'user';
            const div = document.createElement('div');
            div.id = `msg-${id}`;
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} animate-in fade-in duration-500`;
            div.innerHTML = `
                <div class="max-w-[85%] space-y-1">
                    <p class="text-[9px] font-black text-slate-600 uppercase tracking-widest ml-2">${isUser ? 'Inquiry' : 'Oracle'}</p>
                    <div class="${isUser ? 'user-bubble text-white' : 'bot-bubble text-slate-100'} px-6 py-4 rounded-3xl chat-msg shadow-xl border border-white/5">
                        ${isUser ? text : formatMarkdown(text)}
                    </div>
                </div>`;
            chatFlow.appendChild(div);
            chatFlow.scrollTo({ top: chatFlow.scrollHeight, behavior: 'smooth' });
            return id;
        }

        function updateBotMessage(id, text) {
            const el = document.getElementById(`msg-${id}`);
            if (el) el.querySelector('.chat-msg').innerHTML = formatMarkdown(text);
        }

        sendBtn.addEventListener('click', () => handleSend());
        userInput.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });

        // Celestial Stars
        for (let i = 0; i < 100; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.width = s.style.height = `${Math.random() * 2}px`;
            s.style.left = `${Math.random() * 100}%`;
            s.style.top = `${Math.random() * 100}%`;
            s.style.setProperty('--duration', `${2 + Math.random() * 4}s`);
            document.getElementById('celestial-bg').appendChild(s);
        }
    </script>
</body>
</html>
